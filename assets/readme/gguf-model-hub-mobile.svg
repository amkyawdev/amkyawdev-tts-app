<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1720" viewBox="0 0 820 1720" role="img" aria-labelledby="title desc">
  <title id="title">Concept preview of the AmkyawDev TTS Studio Hugging Face GGUF Model Hub screen</title>
  <desc id="desc">A dark navy glass phone mockup showing a Hugging Face repository URL, GGUF file discovery with quantization and sizes, compatibility states, a local GGUF import button and a safety note that GGUF is a container, not a runtime. This is an original concept illustration, not a screenshot.</desc>
