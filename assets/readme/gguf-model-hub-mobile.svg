    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060D"/>
      <stop offset="0.55" stop-color="#050A14"/>
      <stop offset="1" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#070C16"/>
      <stop offset="0.55" stop-color="#081120"/>
      <stop offset="1" stop-color="#0A1626"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41F0FF"/>
      <stop offset="1" stop-color="#2F7BFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1726"/>
      <stop offset="1" stop-color="#0A1220"/>
