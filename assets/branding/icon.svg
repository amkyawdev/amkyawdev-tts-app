<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="AmkyawDev TTS Studio waveform speech mark">
  <defs>
    <linearGradient id="amkyaw-bubble" x1="84" y1="104" x2="428" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5C7A"/>
      <stop offset="0.55" stop-color="#E01B3C"/>
      <stop offset="1" stop-color="#B00E27"/>
    </linearGradient>
    <linearGradient id="amkyaw-bars" x1="256" y1="140" x2="256" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3EA"/>
    </linearGradient>
  </defs>
  <!-- speech bubble body -->
  <rect x="84" y="104" width="344" height="252" rx="64" fill="url(#amkyaw-bubble)"/>
  <!-- bubble tail -->
  <path d="M168 330h84l-98 78c-6.4 5.1-14 0.6-14-6.9V330Z" fill="url(#amkyaw-bubble)"/>
  <!-- voice waveform -->
  <g fill="url(#amkyaw-bars)">
    <rect x="150" y="198" width="28" height="64" rx="14"/>
    <rect x="200" y="166" width="28" height="128" rx="14"/>
    <rect x="250" y="140" width="28" height="180" rx="14"/>
    <rect x="300" y="166" width="28" height="128" rx="14"/>
    <rect x="350" y="198" width="28" height="64" rx="14"/>
  </g>
  <!-- sound arcs -->
  <path d="M372 58c27.6 12.4 46 39.8 46 70" stroke="#FF5C7A" stroke-width="18" stroke-linecap="round"/>
  <path d="M400 20c41.7 19.6 70 61.4 70 106" stroke="#FF5C7A" stroke-width="13" stroke-linecap="round" opacity="0.5"/>
</svg>
