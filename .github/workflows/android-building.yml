name: Android Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    name: Build APK and AAB
    needs: quality
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve dependencies
        run: flutter pub get

      # Production signing is enabled only when all four secrets are present.
      # Otherwise the release build falls back to the debug key and the
      # artifact is labelled test-signed. Never commit a keystore.
      - name: Decode optional release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Report signing mode
        run: |
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "Signing mode: **release keystore**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Signing mode: **debug/test key** (release signing secrets not configured)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Show artifact sizes
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: amkyawdev-tts-studio-android-${{ env.ANDROID_KEYSTORE_FILE != '' && 'release-signed' || 'test-signed' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: amkyawdev-tts-studio-android-*
          path: release-assets
          merge-multiple: true

      # upload-artifact keeps the path relative to build/app/outputs, so the
      # files arrive under flutter-apk/ and bundle/release/. Flatten them so the
      # names attached to the release are stable.
      - name: Flatten release assets
        run: |
          set -euo pipefail
          apk="$(find release-assets -name 'app-release.apk' -print -quit)"
          aab="$(find release-assets -name 'app-release.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          cp "$apk" release-assets/app-release.apk
          cp "$aab" release-assets/app-release.aab
          ls -lh release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AmkyawDev TTS Studio ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/app-release.apk
            release-assets/app-release.aab
